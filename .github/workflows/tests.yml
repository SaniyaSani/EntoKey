name: tests

on:
  push:
  pull_request:

jobs:
  corpus-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-corpus.txt
      - run: pytest -q
